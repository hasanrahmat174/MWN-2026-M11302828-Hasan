<button onclick="downloadPPT()">Download PPTX</button>

<script>
function downloadPPT() {
  const link = document.createElement("a");
  link.href = "A1.slide (project proposal).pptx";
  link.download = "A1.slide (project proposal).pptx";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
